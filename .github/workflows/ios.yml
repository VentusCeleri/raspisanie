name: iOS TestFlight

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight"
        type: boolean
        default: true

permissions:
  contents: read

concurrency: { group: ios, cancel-in-progress: true }

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Signing assets
        env:
          DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_APP_B64: ${{ secrets.IOS_PROFILE_APP_B64 }}
          PROFILE_WIDGET_B64: ${{ secrets.IOS_PROFILE_WIDGET_B64 }}
          ASC_KEY_B64: ${{ secrets.ASC_KEY_B64 }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "" "$KC"
          echo "$DIST_P12_B64" | base64 -D > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          for DIR in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            for N in APP WIDGET; do
              V="PROFILE_${N}_B64"
              echo "${!V}" | base64 -D > "$RUNNER_TEMP/$N.mobileprovision"
              UUID=$(security cms -D -i "$RUNNER_TEMP/$N.mobileprovision" | plutil -extract UUID raw -)
              cp "$RUNNER_TEMP/$N.mobileprovision" "$DIR/$UUID.mobileprovision"
            done
          done
          if [ -n "$ASC_KEY_B64" ]; then
            mkdir -p "$HOME/.appstoreconnect/private_keys"
            echo "$ASC_KEY_B64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          fi

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Archive
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project Pary.xcodeproj -scheme Pary -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Pary.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive 2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*deprecated|BUILD|ARCHIVE" || true
          test -d "$RUNNER_TEMP/Pary.xcarchive" || { grep -B2 -A8 "error:" "$RUNNER_TEMP/build.log" | head -150; exit 1; }

      - name: Export ipa
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>P7FFVJWCKW</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key><dict>
              <key>ru.ventusceleri.pary</key><string>Pary AppStore app</string>
              <key>ru.ventusceleri.pary.widget</key><string>Pary AppStore widget</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Pary.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        with:
          name: pary-ipa
          path: ${{ runner.temp }}/export/*.ipa

      - name: Upload to TestFlight
        if: env.ASC_KEY_ID != '' && (github.event_name == 'push' || inputs.upload)
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP"/export/*.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
