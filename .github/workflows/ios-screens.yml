name: iOS screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"; xcodebuild -version
      - run: brew install xcodegen
      - name: Build for simulator
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -project Pary.xcodeproj -scheme Pary -configuration Debug -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Shoot
        run: |
          set -euo pipefail
          APP=$(ls -d "$RUNNER_TEMP"/dd/Build/Products/Debug-iphonesimulator/Pary.app)
          DEV=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(r,x) for r,l in d.items() if "iOS" in r for x in l if "Pro Max" in x["name"]]
          c.sort(key=lambda t:(t[0],t[1]["name"]))
          print(c[-1][1]["udid"])')
          xcrun simctl boot "$DEV"; xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time "9:41" --dataNetwork wifi --wifiBars 3 --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEV" "$APP"
          mkdir -p shots
          shot() { # name theme appearance [extra args]
            xcrun simctl terminate "$DEV" ru.ventusceleri.pary || true
            xcrun simctl ui "$DEV" appearance "$3"
            xcrun simctl launch "$DEV" ru.ventusceleri.pary -theme "$2" -appearance "$3" "${@:4}"
            sleep 9
            xcrun simctl io "$DEV" screenshot "shots/$1.png"
          }
          shot 1-main-sand-light sand light
          shot 2-main-ocean-dark ocean dark
          shot 3-settings-lilac-dark lilac dark -openSettings
          shot 4-main-forest-light forest light
          sips -g pixelWidth -g pixelHeight shots/*.png
      - uses: actions/upload-artifact@v4
        with: { name: screenshots, path: shots/*.png }
