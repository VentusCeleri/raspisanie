<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пары</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Пары">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f2a44">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f4efe6; --card:#fffdf8; --ink:#14212e; --muted:#6b7480; --line:#e4dccd;
  --navy:#0f2a44; --accent:#e08a2c; --accent-soft:#fbe8d2; --exam:#b4372b; --exam-soft:#f7dcd8;
  --ok:#2f7a55;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b1622; --card:#13212f; --ink:#ece6da; --muted:#93a0ad; --line:#223344;
    --navy:#0b1622; --accent:#f0a04b; --accent-soft:#33261a; --exam:#ff7b6b; --exam-soft:#3a1f1c; --ok:#6fcf97; }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:var(--ink);
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);-webkit-font-smoothing:antialiased}
header{background:var(--navy);color:#f4efe6;padding:14px 16px 0}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.today{font-size:22px;font-weight:700;letter-spacing:-.01em}
.week{font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap}
.week.up{background:var(--accent);color:#14212e}
.now{margin:14px 0 0;padding:14px 16px;border-radius:16px 16px 0 0;background:var(--card);color:var(--ink)}
.now .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.now .room{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-top:4px}
.now .subj{font-size:17px;font-weight:600;margin-top:2px}
.now .meta{font-size:14px;color:var(--muted);margin-top:2px}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
nav{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 8px 8px}
.wk{display:flex;align-items:center;justify-content:space-between;padding:0 8px 8px;font-size:14px;color:var(--muted)}
.wk button{background:none;border:0;color:var(--ink);font-size:22px;width:40px;height:32px;border-radius:8px}
.wk button:active{background:var(--line)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:0;background:none;color:var(--ink);padding:6px 0 8px;border-radius:12px;font:inherit;position:relative}
.day b{display:block;font-size:18px;font-weight:700}
.day small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase}
.day.has::after{content:"";position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.day.ex::after{background:var(--exam)}
.day.is-today b{color:var(--accent)}
.day.sel{background:var(--navy);color:#f4efe6}
.day.sel small{color:#c9d2db}
.day.sel b{color:inherit}
.day.sel.has::after{background:currentColor}
@media (prefers-color-scheme: dark){.day.sel{background:var(--accent);color:#14212e}.day.sel small{color:#3b2a14}}
main{padding:12px 16px}
h2{font-size:15px;font-weight:700;color:var(--muted);margin:6px 0 10px}
.les{display:grid;grid-template-columns:62px 1fr auto;gap:2px 12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;margin-bottom:10px}
.les.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.les.past{opacity:.5}
.les .tm{grid-row:span 3;font-variant-numeric:tabular-nums;font-size:15px;font-weight:700}
.les .tm span{display:block;font-weight:400;color:var(--muted);font-size:13px}
.les .s{font-weight:600;font-size:16px}
.les .r{grid-row:span 2;font-size:22px;font-weight:800;text-align:right;letter-spacing:-.01em}
.les .m{font-size:14px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--line);color:var(--ink);margin-right:6px;vertical-align:1px}
.tag.ЛР{background:var(--accent-soft)}
.tag.Экзамен,.tag.Консультация{background:var(--exam-soft);color:var(--exam)}
.note{grid-column:2 / 4;font-size:13px;font-weight:600;color:var(--exam);margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:28px 0}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:8px 16px}
.exams{margin-top:18px}
.exams a{display:flex;justify-content:space-between;gap:10px;text-decoration:none;color:var(--ink);padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.exams a span:last-child{color:var(--muted);white-space:nowrap}
.exams a.done{opacity:.45}
.opts{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.seg{display:inline-flex;background:var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:8px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip{border:1px solid var(--line);background:none;font:inherit;font-size:13px;color:var(--muted);padding:5px 10px;border-radius:99px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#f4efe6}
.les.off{opacity:.55}
.les.off .s,.les.off .r{text-decoration:line-through}
.tag.pg{background:var(--navy);color:#f4efe6}
.foot a{color:inherit}
.stale{color:var(--exam);font-weight:600}
.wbox{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;position:relative}
.wbox .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--navy);display:flex;align-items:center;justify-content:center}
.wbox .tx{flex:1;min-width:0}
.wbox .tx b{display:block;font-size:16px}
.wbox .tx span{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.wbtn{display:block;width:100%;margin-top:10px;border:0;border-radius:12px;padding:13px;background:var(--accent);color:#14212e;font:inherit;font-size:16px;font-weight:700;text-align:center;text-decoration:none}
.wx{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--muted);font-size:20px;line-height:1;padding:4px}
</style>
</head>
<body>
<header>
  <div class="top"><div class="today" id="today"></div><div class="week" id="week"></div></div>
  <div class="now" id="now"></div>
</header>
<nav>
  <div class="wk"><button id="prev" aria-label="Прошлая неделя">‹</button><span id="wklabel"></span><button id="next" aria-label="Следующая неделя">›</button></div>
  <div class="days" id="days"></div>
</nav>
<main>
  <div class="opts"><div class="seg" id="pg"><button data-pg="1">1 подгруппа</button><button data-pg="2">2 подгруппа</button></div><button class="chip" id="mil">военка</button></div>
  <h2 id="dtitle"></h2>
  <div id="list"></div>
  <div id="wbox"></div>
  <div class="exams" id="exams"></div>
</main>
<div class="foot" id="foot"></div>
<script>
let DATA = {meta:{updated:"",upperMonday:"2026-11-09",group:"РН-23-04"},lessons:[]}, ALL = [];
const SLOTS = [["8:30","10:00"],["10:15","11:45"],["12:00","13:30"],["14:00","15:30"],["15:45","17:15"],["17:20","18:50"]];
const WD = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const WDF = ["понедельник","вторник","среда","четверг","пятница","суббота","воскресенье"];
const MON = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const mins = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addD = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const monday = d => addD(d, -((d.getDay()+6)%7));
const endOf = l => { const i = SLOTS.findIndex(s => s[0]===l.t); return i>=0 ? SLOTS[Math.min(i+l.n-1,5)][1] : l.t; };
let UPMON = parse(DATA.meta.upperMonday);
const isUpper = d => ((Math.round((monday(d)-UPMON)/864e5/7) % 2) + 2) % 2 === 0;
let byDay = {};
const store = (k,v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k,v); } catch(e) { return null; } };
const qpg = new URLSearchParams(location.search).get("pg");
let PG = (qpg === "1" || qpg === "2") ? qpg : (store("pg") || "1");
if (qpg) store("pg", PG);
let MIL = store("mil") === "1";
const live = l => !l.st;
function applyFilter(){
  DATA.lessons = ALL.filter(l => (!l.sg || String(l.sg) === PG) && (!l.mil || MIL));
  byDay = {}; DATA.lessons.forEach(l => (byDay[l.d] = byDay[l.d] || []).push(l));
  document.querySelectorAll("#pg button").forEach(b => b.classList.toggle("on", b.dataset.pg === PG));
  document.getElementById("mil").classList.toggle("on", MIL);
}
const short = d => d.getDate()+" "+MON[d.getMonth()];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let now = new Date(), sel = new Date(now.getFullYear(), now.getMonth(), now.getDate()), viewMon = monday(sel);

function nextLesson(){
  const t = iso(now), m = now.getHours()*60+now.getMinutes();
  for (const l of DATA.lessons){
    if (!live(l)) continue;
    if (l.d > t || (l.d === t && mins(endOf(l)) > m)) return l;
  }
  return null;
}
function renderHeader(){
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  document.getElementById("today").textContent = WD[(d.getDay()+6)%7]+", "+short(d);
  const w = document.getElementById("week");
  const up = isUpper(d); w.textContent = up ? "верхняя неделя" : "нижняя неделя"; w.className = "week"+(up?" up":"");
  const l = nextLesson(), box = document.getElementById("now");
  if (!l){ box.innerHTML = '<div class="lbl">Дальше</div><div class="subj">Пар больше нет — каникулы</div>'; return; }
  const m = now.getHours()*60+now.getMinutes(), today = l.d === iso(now);
  const going = today && mins(l.t) <= m;
  let lbl;
  if (going) lbl = "Сейчас · до "+endOf(l);
  else if (today){ const left = mins(l.t)-m; lbl = "Следующая · через "+(left>=60? Math.floor(left/60)+" ч "+(left%60)+" мин" : left+" мин"); }
  else { const ld = parse(l.d); const tomorrow = iso(addD(parse(iso(now)),1)) === l.d;
    lbl = (tomorrow ? "Завтра" : WD[(ld.getDay()+6)%7]+", "+short(ld))+" · "+l.t; }
  let bar = "";
  if (going){ const a = mins(l.t), b = mins(endOf(l)); bar = '<div class="bar"><i style="width:'+Math.round((m-a)/(b-a)*100)+'%"></i></div>'; }
  box.innerHTML = '<div class="lbl">'+lbl+'</div><div class="room">'+esc(l.r)+'</div><div class="subj">'+esc(l.s)+'</div>'+
    '<div class="meta">'+esc(l.ty)+(today&&!going?' · '+l.t+'–'+endOf(l):'')+' · '+esc(l.te)+'</div>'+(l.note?'<div class="meta" style="color:var(--exam);font-weight:600">'+esc(l.note)+'</div>':'')+bar;
}
function renderWeek(){
  const box = document.getElementById("days"); box.innerHTML = "";
  const todayIso = iso(now);
  for (let i=0;i<7;i++){
    const d = addD(viewMon,i), k = iso(d), ls = (byDay[k]||[]).filter(live);
    const b = document.createElement("button");
    b.className = "day"+(ls.length?" has":"")+(ls.some(l=>l.ty==="Экзамен")?" ex":"")+(k===todayIso?" is-today":"")+(k===iso(sel)?" sel":"");
    b.innerHTML = "<small>"+WD[i]+"</small><b>"+d.getDate()+"</b>";
    b.onclick = () => { sel = d; render(); };
    box.appendChild(b);
  }
  const end = addD(viewMon,6);
  document.getElementById("wklabel").textContent = short(viewMon)+" – "+short(end)+" · "+(isUpper(viewMon)?"верхняя":"нижняя");
}
function renderDay(){
  const k = iso(sel), ls = byDay[k]||[];
  document.getElementById("dtitle").textContent = WDF[(sel.getDay()+6)%7][0].toUpperCase()+WDF[(sel.getDay()+6)%7].slice(1)+", "+short(sel);
  const box = document.getElementById("list");
  if (!ls.length){
    const nxt = DATA.lessons.find(l => l.d > k && live(l));
    box.innerHTML = '<div class="empty"><b>Пар нет</b>'+(nxt? "Следующие — "+WD[(parse(nxt.d).getDay()+6)%7]+", "+short(parse(nxt.d)) : "")+'</div>';
    return;
  }
  const tIso = iso(now), m = now.getHours()*60+now.getMinutes();
  box.innerHTML = ls.map(l => {
    const past = k < tIso || (k === tIso && mins(endOf(l)) <= m);
    const cur = k === tIso && mins(l.t) <= m && m < mins(endOf(l));
    return '<div class="les'+(past?" past":"")+(cur&&live(l)?" cur":"")+(live(l)?"":" off")+'"><div class="tm">'+l.t+'<span>'+endOf(l)+'</span></div>'+
      '<div class="s">'+esc(l.s)+'</div><div class="r">'+esc(l.r)+'</div>'+
      '<div class="m"><span class="tag '+esc(l.ty)+'">'+esc(l.ty)+(l.n>1?" ×"+l.n:"")+'</span>'+(l.sg?'<span class="tag pg">'+l.sg+' пг</span>':'')+esc(l.te)+'</div>'+
      (l.note?'<div class="note">'+esc(l.note)+'</div>':'')+'</div>';
  }).join("");
}
function renderExams(){
  const ex = DATA.lessons.filter(l => l.ty==="Экзамен" && live(l)), t = iso(now);
  document.getElementById("exams").innerHTML = '<h2>Экзамены</h2>'+ex.map(l => {
    const d = parse(l.d);
    return '<a href="#" data-d="'+l.d+'" class="'+(l.d<t?"done":"")+'"><span>'+esc(l.s)+'</span><span>'+WD[(d.getDay()+6)%7]+' '+short(d)+' · '+l.t+' · ауд. '+esc(l.r)+'</span></a>';
  }).join("");
  document.querySelectorAll("#exams a").forEach(a => a.onclick = e => { e.preventDefault(); sel = parse(a.dataset.d); viewMon = monday(sel); render(); window.scrollTo({top:0,behavior:"smooth"}); });
}
function render(){ now = new Date(); renderHeader(); renderWeek(); renderDay(); }
document.getElementById("prev").onclick = () => { viewMon = addD(viewMon,-7); sel = viewMon; render(); };
document.getElementById("next").onclick = () => { viewMon = addD(viewMon,7); sel = viewMon; render(); };
let sx = null;
document.querySelector("main").addEventListener("touchstart", e => sx = e.touches[0].clientX, {passive:true});
document.querySelector("main").addEventListener("touchend", e => {
  if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) < 60) return; sel = addD(sel, dx < 0 ? 1 : -1); viewMon = monday(sel); render();
}, {passive:true});
function renderFoot(){
  const u = DATA.meta.updated || "", m = u.match(/^(\d\d)\.(\d\d)\.(\d{4})/);
  const age = m ? (new Date() - new Date(+m[3], +m[2]-1, +m[1])) / 864e5 : 99;
  const f = document.getElementById("foot");
  f.innerHTML = esc(DATA.meta.group)+' · '+PG+' подгруппа · <span class="'+(age>2?"stale":"")+'">с сайта Губкина, обновлено '+esc(u||"—")+'</span>'+(window.ParyApp ? '' : ' · <a href="widget.html">виджет на телефон</a>')+
    (navigator.share ? ' · <a href="#" id="share">поделиться</a>' : '');
  const s = document.getElementById("share");
  if (s) s.onclick = e => { e.preventDefault(); navigator.share({title:"Пары "+DATA.meta.group, url: location.origin+location.pathname+"?pg="+PG}).catch(()=>{}); };
}
function refresh(){ applyFilter(); render(); renderExams(); renderFoot(); renderWidgetBox(); }
function renderWidgetBox(){
  const box = document.getElementById("wbox"), app = window.ParyApp;
  let has = false; if (app) try { has = app.hasWidget(); } catch(e) {}
  if (has || (!app && store("wclosed") === "1")) { box.innerHTML = ""; box.className = ""; return; }
  const ico = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f4efe6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17.5 14v7M14 17.5h7"/></svg>';
  box.innerHTML = '<div style="flex:1"><div style="display:flex;align-items:center;gap:12px"><div class="ic">'+ico+'</div><div class="tx"><b>Виджет на экран</b><span>Ближайшая пара и аудитория — не открывая '+(app?'приложение':'сайт')+'</span></div></div>'+
    (app ? '<button class="wbtn" id="wadd">Добавить виджет</button>' : '<a class="wbtn" href="widget.html">Поставить виджет</a>')+'</div>'+
    (app ? '' : '<button class="wx" id="wx" aria-label="Скрыть">×</button>');
  box.className = "wbox";
  const add = document.getElementById("wadd");
  if (add) add.onclick = () => { try { app.addWidget(); } catch(e) {} setTimeout(renderWidgetBox, 4000); };
  const x = document.getElementById("wx");
  if (x) x.onclick = () => { store("wclosed","1"); box.innerHTML = ""; box.className = ""; };
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) renderWidgetBox(); });

document.querySelectorAll("#pg button").forEach(b => b.onclick = () => { PG = b.dataset.pg; store("pg", PG); if (window.ParyApp) try { ParyApp.setPg(PG); } catch(e) {} refresh(); });
document.getElementById("mil").onclick = () => { MIL = !MIL; store("mil", MIL ? "1" : "0"); refresh(); };
function load(){
  return fetch("data.json", {cache: "no-store"}).then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => {
    DATA = d; ALL = d.lessons; UPMON = parse(d.meta.upperMonday); refresh();
  }).catch(() => { if (!ALL.length) document.getElementById("list").innerHTML = '<div class="empty"><b>Нет связи</b>Откройте один раз с интернетом</div>'; });
}
refresh(); load();
setInterval(render, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden){ load(); const t = new Date(); if (iso(t)!==iso(now)){ sel = new Date(t.getFullYear(),t.getMonth(),t.getDate()); viewMon = monday(sel);} render(); } });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
