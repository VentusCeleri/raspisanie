name: Pary
options:
  bundleIdPrefix: ru.ventusceleri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: P7FFVJWCKW
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "iPhone Distribution"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Pary:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: PairsWidget
    scheme: {}
    entitlements:
      path: App/Pary.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)ru.ventusceleri.pary.shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.ventusceleri.pary
        PROVISIONING_PROFILE_SPECIFIER: "Pary AppStore app"
        CODE_SIGN_IDENTITY: "iPhone Distribution"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Пары
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
  PairsWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/PairsWidget.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)ru.ventusceleri.pary.shared"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.ventusceleri.pary.widget
        PROVISIONING_PROFILE_SPECIFIER: "Pary AppStore widget"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_IDENTITY: "iPhone Distribution"
        CODE_SIGN_STYLE: Manual
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Пары
        CFBundleDevelopmentRegion: ru
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
